<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — The Wanderlust.pk Admin</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <h1 class="login-brand">The Wanderlust.pk</h1>
      <p class="login-sub">Sign in to manage packages, bookings and messages.</p>

      <p id="error" class="error-text"></p>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-full" id="submit-btn">Sign in</button>
      </form>

      <p class="hint">No account yet?</p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
